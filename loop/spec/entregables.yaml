  # ------------------------------------------------------------------ recursos del desafío
  # Paquetes que suman los "NASA Data & Resources" del desafío que el CLAUDE.md no incluía
  # (pestaña Resources de "Field Shift: Adapting Farms with NASA Data", consultada 2026-11-14).
  # Mismo contrato de CSV (CLAUDE.md §4) y mismas reglas. Nombres de columna: propuesta.
  # Las fuentes que no se usan, y por qué, están en la hoja Fuentes de loop/runs/registro_rondas.xlsx.

  economia:
    titulo: "economia — precios recibidos (USDA NASS) y costos y retornos (USDA ERS)"
    seccion_claude: "recursos del desafío: USDA NASS Quick Stats y USDA AMS Market News; CLAUDE.md §8, research 7"
    descripcion: >
      Precios y costos para comparar rotaciones (short_desc, regiones e ítems verificados en
      docs/research/precios_margenes.md). Por estado, año y cultivo: el precio recibido de NASS del año
      comercial (statisticcat_desc=PRICE RECEIVED, reference_period_desc=MARKETING YEAR,
      agg_level_desc=STATE) en su unidad original, sacado del volcado público qs.crops que ya está en
      data/raw/cultivos/nass/ (leelo desde ahí, sin copiarlo, y anotá en el manifest ese archivo como
      fuente) o de la API si hay NASS_API_KEY. Los costos y retornos por acre sembrado salen de USDA ERS
      Commodity Costs and Returns, región Heartland (IA, IL e IN están adentro: el mismo valor para los
      tres estados): valor de la producción, costos operativos, costos totales listados y valor de la
      producción menos costos operativos. Granos (maiz, soja, trigo_invierno, avena) en
      economia_anual.csv; forrajes (alfalfa, heno) en economia_forrajes_anual.csv, solo con precio (ERS
      no tiene costos de forrajes). Los nombres de cultivo son los de produccion_anual.csv. (D), (S) y
      (NA) van vacíos, con el código en flag_nass. USDA AMS Market News es opcional.
    escribe: [src/economia/, data/raw/economia/, data/interim/economia/, data/processed/economia/, docs/datasets/economia.md]
    process: src/economia/process.py
    salidas: [data/processed/economia/]
    requiere: [base]
    archivos:
      - ruta: data/processed/economia/economia_anual.csv
        temporal: anual
        unidad: estado
        claves: [fips_estado, anio, cultivo]
        multiplica_por: 4
        # NASS dejó de publicar el precio del trigo en Iowa (2020+) y el de la avena en Indiana (2016+)
        umbral_cobertura: 0.85
        nota: "Cultivos: maiz, soja, trigo_invierno, avena. ERS publica trigo (todo) y avena por región: documentá la equivalencia."
        coherencia: ["costo_operativo_usd_ac <= costo_total_usd_ac"]
        columnas:
          - {nombre: precio_usd_bu, catalogo: MK01, rango: [0.5, 40]}
          - {nombre: valor_produccion_usd_ac, rango: [0, 3000]}
          - {nombre: costo_operativo_usd_ac, catalogo: MK03, rango: [10, 1500]}
          - {nombre: costo_total_usd_ac, catalogo: MK03, rango: [20, 2500]}
          - {nombre: margen_operativo_usd_ac, catalogo: MK02, rango: [-1500, 2500]}
          - {nombre: flag_nass, tipo: texto, sin_cobertura: true}
      - ruta: data/processed/economia/economia_forrajes_anual.csv
        temporal: anual
        unidad: estado
        claves: [fips_estado, anio, cultivo]
        multiplica_por: 2
        nota: "Cultivos: alfalfa (HAY, ALFALFA) y heno (HAY, (EXCL ALFALFA)), en dólares por tonelada corta (2000 lb), como los publica NASS."
        columnas:
          - {nombre: precio_usd_ton, catalogo: MK01, rango: [10, 700]}
          - {nombre: flag_nass, tipo: texto, sin_cobertura: true}

  aptitud:
    titulo: "aptitud — FAO GAEZ v4: aptitud y rendimiento alcanzable, clima actual y 2041–2070"
    seccion_claude: "recursos del desafío: FAO Global Agro-Ecological Zones (GAEZ)"
    descripcion: >
      FAO GAEZ v4 (gaez.fao.org, capas públicas): índice de aptitud (de 0–10000 a 0–100) y rendimiento
      alcanzable en secano con manejo alto de maíz, soja, trigo, avena y alfalfa, con el clima de
      referencia 1981–2010 y con el de 2041–2070 bajo RCP8.5 (ensamble de modelos si existe; si no,
      documentá cuáles usaste). Sirve para ver qué cultivos ganan o pierden aptitud con el clima que
      viene. Media por condado sobre los píxeles agrícolas (data/reference/mascara_agricola.tif) si tiene
      sentido a la resolución de GAEZ; si no, sobre todo el condado (documentalo). Verificá en el portal
      los nombres exactos de las capas (tema "Suitability and Attainable Yield") y la unidad del
      rendimiento (GAEZ lo da en kg de materia seca por hectárea: documentalo). Una fila por condado.
    escribe: [src/aptitud/, data/raw/aptitud/, data/interim/aptitud/, data/processed/aptitud/, docs/datasets/aptitud.md]
    process: src/aptitud/process.py
    salidas: [data/processed/aptitud/]
    requiere: [base]
    archivos:
      - ruta: data/processed/aptitud/aptitud_estatico.csv
        temporal: estatico
        claves: [fips]
        columnas:
          - {nombre: aptitud_maiz_1981_2010, catalogo: Z01, rango: [0, 100]}
          - {nombre: aptitud_soja_1981_2010, catalogo: Z01, rango: [0, 100]}
          - {nombre: aptitud_trigo_1981_2010, catalogo: Z01, rango: [0, 100]}
          - {nombre: aptitud_avena_1981_2010, catalogo: Z01, rango: [0, 100]}
          - {nombre: aptitud_alfalfa_1981_2010, catalogo: Z01, rango: [0, 100]}
          - {nombre: aptitud_maiz_2041_2070, catalogo: Z04, rango: [0, 100]}
          - {nombre: aptitud_soja_2041_2070, catalogo: Z04, rango: [0, 100]}
          - {nombre: aptitud_trigo_2041_2070, catalogo: Z04, rango: [0, 100]}
          - {nombre: aptitud_avena_2041_2070, catalogo: Z04, rango: [0, 100]}
          - {nombre: aptitud_alfalfa_2041_2070, catalogo: Z04, rango: [0, 100]}
          - {nombre: rend_alcanzable_maiz_kgha_1981_2010, catalogo: Z02, rango: [0, 25000]}
          - {nombre: rend_alcanzable_maiz_kgha_2041_2070, catalogo: Z02, rango: [0, 25000]}
          - {nombre: rend_alcanzable_soja_kgha_1981_2010, catalogo: Z02, rango: [0, 10000]}
          - {nombre: rend_alcanzable_soja_kgha_2041_2070, catalogo: Z02, rango: [0, 10000]}
          - {nombre: rend_alcanzable_trigo_kgha_1981_2010, catalogo: Z02, rango: [0, 15000]}
          - {nombre: rend_alcanzable_trigo_kgha_2041_2070, catalogo: Z02, rango: [0, 15000]}

  paisaje:
    titulo: "paisaje — USGS NLCD: cobertura del suelo a 30 m"
    seccion_claude: "recursos del desafío: USGS National Land Cover Database (NLCD)"
    descripcion: >
      USGS National Land Cover Database: porcentaje del área de cada condado en cultivos (clase 82),
      pasturas y heno (81), bosque (41 a 43), humedales (90 y 95), urbano (21 a 24) y agua (11), y la
      superficie impermeable media (producto de impermeabilidad de NLCD). Preferí Annual NLCD (una capa
      por año) para cubrir 2000–2025; si solo conseguís las ediciones clásicas (2001, 2004, 2006, 2008,
      2011, 2013, 2016, 2019, 2021), poné solo esos años y documentalo. El porcentaje es sobre el área
      total del condado, no sobre la máscara agrícola. Leé las capas por ventana sobre los tres estados
      (COG o servicios de MRLC) para no pasar los 5 GB en data/raw/paisaje.
    escribe: [src/paisaje/, data/raw/paisaje/, data/interim/paisaje/, data/processed/paisaje/, docs/datasets/paisaje.md]
    process: src/paisaje/process.py
    salidas: [data/processed/paisaje/]
    requiere: [base]
    archivos:
      - ruta: data/processed/paisaje/paisaje_anual.csv
        temporal: anual
        claves: [fips, anio]
        # Annual NLCD puede no tener todavía 2024 y 2025
        umbral_cobertura: 0.9
        columnas:
          - {nombre: pct_cultivos_nlcd, rango: [0, 100]}
          - {nombre: pct_pasturas_heno_nlcd, rango: [0, 100]}
          - {nombre: pct_bosque_nlcd, rango: [0, 100]}
          - {nombre: pct_humedales_nlcd, rango: [0, 100]}
          - {nombre: pct_urbano_nlcd, rango: [0, 100]}
          - {nombre: pct_agua_nlcd, rango: [0, 100]}
          - {nombre: impermeable_pct, rango: [0, 100]}

  teledeteccion:
    titulo: "teledeteccion — Landsat y Sentinel-2 a 30 m: lotes desnudos y cobertura invernal"
    seccion_claude: "recursos del desafío: Landsat y Copernicus Sentinel-2"
    descripcion: >
      Landsat Collection 2 Level-2 (NASA/USGS, 30 m) y Sentinel-2 L2A (ESA, 10–20 m, 2017+), o su versión
      armonizada HLS (NASA, 30 m). Miden lo que MODIS (250 m) mezcla: qué parte de los lotes queda desnuda
      y cuál tiene cobertura verde fuera de la temporada (cultivos de cobertura, trigo de invierno). Por
      condado y año, sobre los píxeles agrícolas del CDL de ese año: % de píxeles con suelo desnudo
      (NDVI < 0,25) en la mediana de abril–mayo y en la de octubre–noviembre, % con cobertura verde
      (NDVI ≥ 0,3) en la mediana del 15 de marzo al 30 de abril, BSI medio de abril–mayo, NDVI máximo de
      abril–septiembre (media de los píxeles), cantidad de escenas válidas y fracción de píxeles válidos.
      Enmascarar nubes, sombras, nieve y agua con las bandas de calidad (QA_PIXEL, SCL o Fmask). Para no
      bajar escenas enteras: leer las COG por ventana o muestrear al azar píxeles agrícolas de cada
      condado (documentá el método, el tamaño de la muestra, la resolución efectiva y los umbrales).
      Planetary Computer tiene Landsat y Sentinel-2 sin login; HLS por LP DAAC pide Earthdata. Cubrí
      primero todos los condados en los años recientes y completá hacia atrás en las rondas siguientes.
    escribe: [src/teledeteccion/, data/raw/teledeteccion/, data/interim/teledeteccion/, data/processed/teledeteccion/, docs/datasets/teledeteccion.md]
    process: src/teledeteccion/process.py
    salidas: [data/processed/teledeteccion/]
    requiere: [base]
    archivos:
      - ruta: data/processed/teledeteccion/teledeteccion_anual.csv
        temporal: anual
        claves: [fips, anio]
        # desde el primer CDL nacional; nubes, nieve y el bandeado de Landsat 7 dejan huecos
        desde: "2008-01-01"
        umbral_cobertura: 0.8
        columnas:
          - {nombre: pct_suelo_desnudo_abr_may, catalogo: F08, rango: [0, 100]}
          - {nombre: pct_suelo_desnudo_oct_nov, catalogo: F08, rango: [0, 100]}
          - {nombre: pct_cobertura_verde_mar_abr, rango: [0, 100]}
          - {nombre: bsi_abr_may, catalogo: H05, rango: [-1, 1]}
          - {nombre: ndvi_max_30m, catalogo: H02, rango: [-1, 1]}
          - {nombre: n_escenas_validas, rango: [0, 5000]}
          - {nombre: frac_pixeles_validos, catalogo: H06, rango: [0, 1]}

  validacion:
    titulo: "validacion — PRISM y CoCoRaHS: lluvia y temperatura medidas para validar POWER e IMERG"
    seccion_claude: "§6.1 (PRISM opcional); recursos del desafío: PRISM y CoCoRaHS"
    descripcion: >
      Datos de superficie para validar la lluvia y la temperatura de NASA POWER e IMERG (no son de la
      NASA). PRISM (Oregon State University, 4 km, mensual; uso no comercial con cita): media por condado
      de la lluvia y de las temperaturas máxima, mínima y media de cada mes 2000–2025 (servicio web de
      PRISM; respetá sus límites de descarga). CoCoRaHS (pluviómetros de voluntarios): lluvia mensual por
      condado como media de las estaciones que reportaron al menos 25 días del mes, y cuántas son (los
      condados sin estaciones van vacíos). En el data card, una tabla corta con el sesgo y la correlación
      mensual de POWER frente a PRISM y a CoCoRaHS.
    escribe: [src/validacion/, data/raw/validacion/, data/interim/validacion/, data/processed/validacion/, docs/datasets/validacion.md]
    process: src/validacion/process.py
    salidas: [data/processed/validacion/]
    requiere: [base]
    archivos:
      - ruta: data/processed/validacion/validacion_mensual.csv
        temporal: mensual
        claves: [fips, anio, mes]
        # CoCoRaHS no tiene estaciones en todos los condados
        umbral_cobertura: 0.6
        coherencia: ["tmin_prism_c <= tmed_prism_c <= tmax_prism_c"]
        columnas:
          - {nombre: prec_prism_mm, rango: [0, 1000]}
          - {nombre: tmax_prism_c, rango: [-30, 45]}
          - {nombre: tmin_prism_c, rango: [-40, 35]}
          - {nombre: tmed_prism_c, rango: [-35, 40]}
          - {nombre: prec_cocorahs_mm, rango: [0, 1000], desde: "2008-01-01"}
          - {nombre: n_estaciones_cocorahs, rango: [0, 500], desde: "2008-01-01"}

  ecostress:
    titulo: "ecostress — ECOSTRESS: temperatura de superficie, ET y estrés evaporativo a 70 m"
    seccion_claude: "recursos del desafío: ECOSTRESS"
    descripcion: >
      ECOSTRESS (NASA/JPL, desde la Estación Espacial, 2018-07 en adelante, con pasadas a horas variables):
      temperatura de superficie (ECO_L2T_LSTE), evapotranspiración (ECO_L3T_JET) y el índice de estrés
      evaporativo (ECO_L4T_ESI) de la colección 2 en LP DAAC. Pide Earthdata: lo más simple es un pedido
      por área en AppEEARS con los polígonos de condados.gpkg (va en cola: lanzalo, anotá el ID en tu
      bitácora y seguí en la ronda siguiente). Media mensual por condado sobre los píxeles agrícolas, solo
      con píxeles de buena calidad y sin nubes, y cuántas pasadas se usaron. Verificá en LP DAAC los
      nombres exactos de producto y capa.
    escribe: [src/ecostress/, data/raw/ecostress/, data/interim/ecostress/, data/processed/ecostress/, docs/datasets/ecostress.md]
    process: src/ecostress/process.py
    salidas: [data/processed/ecostress/]
    requiere: [base]
    archivos:
      - ruta: data/processed/ecostress/ecostress_mensual.csv
        temporal: mensual
        claves: [fips, anio, mes]
        desde: "2018-08-01"
        # pasadas irregulares, nubes y nieve: muchos meses sin dato
        umbral_cobertura: 0.6
        columnas:
          - {nombre: lst_ecostress_c, catalogo: X01, rango: [-40, 75], login: earthdata}
          - {nombre: et_ecostress_mm_dia, catalogo: X02, rango: [0, 15], login: earthdata}
          - {nombre: esi_ecostress, catalogo: X03, rango: [0, 2], login: earthdata}
          - {nombre: n_pasadas_ecostress, rango: [0, 300], login: earthdata}

  nldas:
    titulo: "nldas — NLDAS-2: humedad del suelo por capas, ET y escorrentía desde 1979"
    seccion_claude: "recursos del desafío: NLDAS/GLDAS"
    descripcion: >
      NLDAS-2 (NASA GES DISC), modelo Noah (NLDAS_NOAH0125_M, mensual, 0,125°, desde 1979): completa a SMAP,
      que empieza en 2015-03. Media mensual por condado de la humedad del suelo de 0–10 cm y de 0–100 cm
      (los kg/m² de cada capa pasados a m³/m³ dividiendo por su espesor), la anomalía z de la de 0–100 cm
      por mes calendario con base 1991–2020, la evapotranspiración, la escorrentía total (superficial más
      subsuperficial) y el equivalente en agua de la nieve. GES DISC pide Earthdata: buscá primero un
      acceso público sin login al mismo producto (documentalo). GLDAS no hace falta: NLDAS cubre EE.UU. con
      más resolución.
    escribe: [src/nldas/, data/raw/nldas/, data/interim/nldas/, data/processed/nldas/, docs/datasets/nldas.md]
    process: src/nldas/process.py
    salidas: [data/processed/nldas/]
    requiere: [base]
    archivos:
      - ruta: data/processed/nldas/nldas_mensual.csv
        temporal: mensual
        claves: [fips, anio, mes]
        columnas:
          - {nombre: sm_0_10cm_m3m3, catalogo: G01, rango: [0, 0.6], login: earthdata}
          - {nombre: sm_0_100cm_m3m3, catalogo: G02, rango: [0, 0.6], login: earthdata}
          - {nombre: sm_0_100cm_anom_z, rango: [-6, 6], login: earthdata}
          - {nombre: et_nldas_mm, catalogo: G03, rango: [0, 300], login: earthdata}
          - {nombre: escorrentia_nldas_mm, catalogo: G04, rango: [0, 600], login: earthdata}
          - {nombre: swe_nldas_mm, rango: [0, 1500], login: earthdata}

  hidrologia:
    titulo: "hidrologia — USGS NWIS: napa freática y caudales medidos"
    seccion_claude: "recursos del desafío: USGS National Water Information System (NWIS)"
    descripcion: >
      USGS National Water Information System (hoy por las Water Data APIs de USGS, sin login): profundidad
      de la napa en los pozos de monitoreo de cada condado y caudal en sus estaciones de aforo. Por condado
      y mes: mediana de la profundidad a la napa (m bajo la superficie) de los pozos con dato ese mes y
      cuántos son; percentil del caudal medio mensual de cada estación respecto de su propio período
      1991–2020, promediado entre las estaciones del condado, y cuántas son. Muchos condados no tienen
      pozos o estaciones: van vacíos.
    escribe: [src/hidrologia/, data/raw/hidrologia/, data/interim/hidrologia/, data/processed/hidrologia/, docs/datasets/hidrologia.md]
    process: src/hidrologia/process.py
    salidas: [data/processed/hidrologia/]
    requiere: [base]
    archivos:
      - ruta: data/processed/hidrologia/hidrologia_mensual.csv
        temporal: mensual
        claves: [fips, anio, mes]
        # pocos condados tienen pozos de monitoreo con serie mensual
        umbral_cobertura: 0.3
        columnas:
          - {nombre: napa_prof_m, rango: [0, 300]}
          - {nombre: n_pozos, rango: [0, 1000]}
          - {nombre: caudal_pctl, rango: [0, 100]}
          - {nombre: n_estaciones_aforo, rango: [0, 300]}

  lotes:
    titulo: "lotes — datos por píxel de 30 m dentro de 10 lotes de demostración (pedido 1 del equipo de ML)"
    seccion_claude: "§6.6"
    # No entra en tabla_anual.csv ni en tabla_mensual.csv: otra granularidad (lote y píxel).
    fuera_de_tablas: true
    descripcion: >
      Pedido del equipo de ML (aprobado por el humano el 2026-11-14): datos por píxel de 30 m dentro de 10 lotes
      concretos, para que ML divida cada lote en sectores (loma seca, bajo húmedo, zona media). Va a una entrega
      aparte (fieldshift_lotes_v1) y no entra en las tablas unidas. GRILLA: la de data/reference/mascara_agricola.tif
      (EPSG:5070, 30 m; los centros de píxel son múltiplos de 30 m). Un píxel es del lote si su centro cae dentro del
      polígono; es interior (interior = 1) si su centro cae dentro del polígono achicado 30 m hacia adentro.
      LOTES: polígonos de USDA NASS Crop Sequence Boundaries (CSB) de la ventana de 8 años más reciente que esté
      publicada (todavía no está bajado: GeoParquet en Source Cooperative, fiboa/us-usda-cropland, con filtro espacial,
      o la descarga de NASS por estado). id_lote = <fips>_<CSBID> (solo letras y números); px_id = entero único dentro
      del lote (por ejemplo, el índice fila × columna en el recuadro del lote). Paisajes y cantidades: 3 lotes en la
      llanura con depresiones del Des Moines Lobe (Story 19169, Hamilton 19079 o Wright 19197), 3 en lomas sobre loess
      (Crawford 19047 o Shelby 19165), 2 de control en llanura plana (Champaign 17019) y 2 en un condado de Indiana a
      elección. Criterios: maíz o soja en al menos 6 de los 8 años de la ventana del CSB; 30 a 120 ha y forma compacta;
      al menos 300 píxeles interiores; sin riego (pct_riego del censo más reciente del condado menor a 5 %); en
      depresiones y lomas, relieve dentro del lote (NASADEM, máxima menos mínima) de más de 3 m. Elegí con una regla
      determinística (documentala) y guardá en lotes.csv el motivo y cuántos candidatos cumplían. Empezá por
      lotes.csv, lotes.gpkg y pixeles.csv: definen los lotes y los píxeles contra los que se mide la cobertura de los
      demás archivos. VEGETACIÓN (vegetacion_px_obs.csv): todas las observaciones despejadas del 1 de marzo al 30 de
      noviembre de 2000 a 2025, una fila por píxel, fecha, producto y sensor. Landsat Collection 2 Level-2
      (landsat-c2-l2 en Planetary Computer, sin login; L5, L7, L8 y L9; reflectancia = DN × 0.0000275 − 0.2) con las
      mismas reglas de QA_PIXEL que el paquete teledeteccion (relleno, nube dilatada, cirro, nube, sombra, nieve y
      agua), y HLS v2 S30 (hls2-s30 en Planetary Computer; el archivo completo está en LP DAAC con Earthdata) con las
      equivalentes de Fmask; HLS L30 es opcional (producto hls_l30). slc_off = 1 en Landsat 7 desde el 2003-05-31.
      qa_valor = el valor crudo de QA_PIXEL (Landsat) o de Fmask (HLS). EVI2 = 2.5 (nir − red) / (nir + 2.4 red + 1);
      GCVI = nir / green − 1; NDMI = (nir − swir1) / (nir + swir1). Redondeá reflectancias e índices a 4 decimales y
      escribí el archivo ordenado por las claves (es grande: se compara fila a fila al reproducirlo). Los resúmenes de
      vegetacion_px_anual.csv usan solo ese año y solo Landsat (serie homogénea 2000–2025); las columnas _s2 salen de
      HLS S30. CULTIVO: clase del CDL por píxel y año desde 2008 (y de antes si existe para el estado). Las teselas de
      2024–2025 de data/raw/cultivos son exportaciones a 30 m por vecino más cercano y corren los bordes de los lotes:
      para esos años bajá el CDL nativo de 10 m de la ventana de cada lote y guardá la clase con más superficie dentro
      del píxel de 30 m y su fracción (frac_clase). En lotes_anual.csv, el cultivo principal de los píxeles interiores,
      su porcentaje y lote_partido = 1 si es menos de 90 % (no borrar el lote). TERRENO: NASADEM ya bajado en
      data/raw/suelo_terreno/nasadem (leelo desde ahí y registralo en el manifest); las derivadas se calculan en la
      grilla original (o en el DEM suavizado: documentá cómo) antes del remuestreo bilineal a la grilla de 30 m; el TWI
      con el área aportante de una ventana de al menos 2 km alrededor del lote; prof_depresion_m = DEM con las
      depresiones rellenas menos el DEM; curvaturas en 1/m, TPI en m y aspecto vacío donde la pendiente es 0. Extra
      aprobado por el humano: USGS 3DEP lidar (1 m o 1/3"; no es de la NASA),
      las mismas variables agregadas a 30 m en las columnas _3dep. SUELO: SSURGO por Soil Data Access con consulta
      espacial: mukeys que cortan cada lote y sus polígonos rasterizados a 10 m en una grilla alineada con la de 30 m;
      fracción de cada mukey en cada píxel en suelo_px.csv y sus atributos en suelo_mukey.csv, con los mismos cálculos
      y nombres que suelo_terreno (0–30 cm ponderado; aws de Valu1 en mm). frec_inundacion traduce flodfreqdcd (None →
      nula, Very rare → muy_rara, Rare → rara, Occasional → ocasional, Frequent → frecuente, Very frequent →
      muy_frecuente); en los demás textos de SSURGO, un "None" va como "nula" ("None" es un valor de relleno prohibido
      por el contrato). SUELO DESNUDO: por píxel y año, mediana de
      la reflectancia Landsat de las observaciones con NDVI < 0,25 del 15 de marzo al 15 de mayo y de octubre–noviembre,
      NBR2 = (swir1 − swir2) / (swir1 + swir2) y cuántas observaciones entraron; el compuesto multianual usa todos los
      años (decilo en la data card). CLIMA del lote: NASA POWER diario en el centroide del lote (mismas variables y
      nombres que clima_diario.csv), IMERG Final diario de la celda de 0,1° que cubre el centroide y SMAP L4 diario
      (zona radicular y superficie) desde 2015-04; los anuales con las mismas ventanas y nombres que clima_anual.csv.
      DRENAJE con caños (opcional): mapa de 30 m de Valayamkunnath y otros (Scientific Data, 2020), si es público.
      NO HACER (lo calcula ML dentro de cada fold): nada de z-scores, percentiles, anomalías ni normalización dentro
      del lote o entre años; no interpolar, suavizar ni rellenar el NDVI en el tiempo; no aplicar filtros espaciales a
      la reflectancia ni a los índices; no armar sectores, clusters ni umbrales de loma o bajo; no mezclar Landsat y
      HLS sin las columnas producto y sensor; no borrar las observaciones de Landsat 7 con SLC-off (van marcadas). La
      data card lleva una sección "Controles de calidad" con el resultado de cada control: píxeles por lote, pureza del
      cultivo por lote y año, distribución de observaciones despejadas (píxeles-año con menos de 3 en julio–agosto),
      2012 aparte (observaciones por sensor y % de píxeles en franjas del SLC-off), coherencia Landsat–Sentinel-2
      (mismo píxel, fechas a 3 días o menos: diferencia media y desvío del NDVI), alineación CSB–CDL, relieve (lotes con
      menos de 2 m) y cobertura de SSURGO (% del lote con mukey y mukeys por lote). process.py regenera todos los CSV
      y el GeoPackage desde data/raw y data/interim, sin bajar nada.
    escribe: [src/lotes/, data/raw/lotes/, data/interim/lotes/, data/processed/lotes/, docs/datasets/lotes.md]
    process: src/lotes/process.py
    salidas: [data/processed/lotes/]
    requiere: [base, cultivos, suelo_terreno]
    archivos:
      - ruta: data/processed/lotes/lotes.csv
        temporal: estatico
        unidad: lote
        claves: [fips, id_lote]
        columnas_prohibidas: &prohibidas_lotes [anom, zscore, _z, percentil, pctl, normaliz, relativ, cluster, sector]
        motivo_prohibidas: &motivo_lotes "nada de normalizar, anomalías, z-scores, percentiles ni sectores: eso lo calcula ML dentro de cada fold"
        columnas:
          - {nombre: paisaje, tipo: categoria, valores: [depresiones, lomas_loess, llanura_control, indiana]}
          - {nombre: csb_ventana, tipo: categoria, valores: ["2008-2015", "2009-2016", "2010-2017", "2011-2018", "2012-2019", "2013-2020", "2014-2021", "2015-2022", "2016-2023", "2017-2024", "2018-2025"]}
          - {nombre: area_ha, rango: [30, 120]}
          - {nombre: area_ac, rango: [74, 297]}
          - {nombre: lat_centroide, rango: [36.9, 43.6]}
          - {nombre: lon_centroide, rango: [-96.7, -84.7]}
          - {nombre: compacidad, rango: [0, 1]}
          - {nombre: n_px, rango: [300, 1500]}
          - {nombre: n_px_interior, rango: [300, 1500]}
          - {nombre: n_anios_maiz_soja, rango: [6, 8]}
          - {nombre: pct_riego_condado, rango: [0, 5]}
          - {nombre: relieve_m, rango: [0, 60]}
          - {nombre: relieve_3dep_m, rango: [0, 60], peso: 0.5}
          - {nombre: motivo, tipo: texto}
          - {nombre: n_candidatos, rango: [1, 1000000]}
      - ruta: data/processed/lotes/lotes_anual.csv
        temporal: anual
        unidad: lote
        claves: [fips, id_lote, anio]
        desde: "2008-01-01"
        columnas_prohibidas: *prohibidas_lotes
        motivo_prohibidas: *motivo_lotes
        columnas:
          - {nombre: cultivo_principal, tipo: categoria, valores: &grupos_cdl [maiz, soja, trigo_invierno, avena, alfalfa, heno, doble_trigo_soja, barbecho, pastizal, otro]}
          - {nombre: cdl_clase_principal, rango: [0, 255]}
          - {nombre: pct_px_cultivo_principal, rango: [0, 100]}
          - {nombre: lote_partido, tipo: categoria, valores: ["0", "1"]}
          # solo los años de la ventana del CSB
          - {nombre: cultivo_csb, tipo: categoria, valores: *grupos_cdl, sin_cobertura: true}
          - {nombre: pct_px_igual_csb, rango: [0, 100], sin_cobertura: true}
      - ruta: data/processed/lotes/pixeles.csv
        temporal: estatico
        unidad: pixel
        claves: [fips, id_lote, px_id]
        columnas_prohibidas: *prohibidas_lotes
        motivo_prohibidas: *motivo_lotes
        columnas:
          - {nombre: x_m, rango: [-52005, 961695]}
          - {nombre: y_m, rango: [1569075, 2288295]}
          - {nombre: lon, rango: [-96.7, -84.7]}
          - {nombre: lat, rango: [36.9, 43.6]}
          - {nombre: dist_borde_m, rango: [0, 2000]}
          - {nombre: interior, tipo: categoria, valores: ["0", "1"]}
          - {nombre: frac_en_lote, rango: [0, 1], peso: 0.5}
      - ruta: data/processed/lotes/vegetacion_px_obs.csv
        temporal: diario
        unidad: pixel
        # millones de filas: el scorer lo lee por partes
        grande: true
        claves: [fips, id_lote, px_id, anio, fecha, producto, sensor]
        columnas_prohibidas: *prohibidas_lotes
        motivo_prohibidas: *motivo_lotes
        # la cantidad de observaciones no se conoce de antemano: la cobertura la mide el especial lotes_obs_cobertura
        columnas:
          - {nombre: producto, tipo: categoria, valores: [landsat_c2_l2, hls_l30, hls_s30], sin_cobertura: true, peso: 0.25}
          - {nombre: sensor, tipo: categoria, valores: [L5, L7, L8, L9, S2A, S2B, S2C], sin_cobertura: true, peso: 0.25}
          - {nombre: refl_blue, rango: [-0.2, 1.6], sin_cobertura: true}
          - {nombre: refl_green, rango: [-0.2, 1.6], sin_cobertura: true}
          - {nombre: refl_red, rango: [-0.2, 1.6], sin_cobertura: true}
          - {nombre: refl_nir, rango: [-0.2, 1.6], sin_cobertura: true}
          - {nombre: refl_swir1, rango: [-0.2, 1.6], sin_cobertura: true}
          - {nombre: refl_swir2, rango: [-0.2, 1.6], sin_cobertura: true}
          - {nombre: ndvi, rango: [-1, 1], sin_cobertura: true}
          - {nombre: evi2, rango: [-1, 1.3], sin_cobertura: true}
          - {nombre: gcvi, rango: [-1, 100], sin_cobertura: true}
          - {nombre: ndmi, rango: [-1, 1], sin_cobertura: true}
          - {nombre: slc_off, tipo: categoria, valores: ["0", "1"], sin_cobertura: true}
          - {nombre: qa_valor, rango: [0, 65535], sin_cobertura: true}
      - ruta: data/processed/lotes/vegetacion_px_anual.csv
        temporal: anual
        unidad: pixel
        claves: [fips, id_lote, px_id, anio]
        # años nublados y 2012 (solo Landsat 7 con SLC-off) dejan píxeles sin observación
        umbral_cobertura: 0.85
        columnas_prohibidas: *prohibidas_lotes
        motivo_prohibidas: *motivo_lotes
        columnas:
          - {nombre: ndvi_max, rango: [-1, 1]}
          - {nombre: doy_ndvi_max, rango: [60, 336]}
          - {nombre: evi2_max, rango: [-1, 1.3]}
          - {nombre: doy_evi2_max, rango: [60, 336]}
          - {nombre: ndvi_media_jul_ago, rango: [-1, 1]}
          - {nombre: n_obs_mar_nov, rango: [0, 200]}
          - {nombre: n_obs_may_jun, rango: [0, 100]}
          - {nombre: n_obs_jul_ago, rango: [0, 100]}
          - {nombre: ndvi_max_s2, rango: [-1, 1], desde: "2016-01-01", peso: 0.5}
          - {nombre: n_obs_jul_ago_s2, rango: [0, 100], desde: "2016-01-01", peso: 0.5}
      - ruta: data/processed/lotes/cultivo_px_anual.csv
        temporal: anual
        unidad: pixel
        claves: [fips, id_lote, px_id, anio]
        desde: "2008-01-01"
        columnas_prohibidas: *prohibidas_lotes
        motivo_prohibidas: *motivo_lotes
        columnas:
          - {nombre: cdl_clase, rango: [0, 255]}
          - {nombre: cultivo, tipo: categoria, valores: *grupos_cdl}
          # CDL de 10 m (2024 en adelante): fracción del píxel de 30 m con la clase mayoritaria
          - {nombre: frac_clase, rango: [0, 1], desde: "2024-01-01"}
      - ruta: data/processed/lotes/terreno_px.csv
        temporal: estatico
        unidad: pixel
        claves: [fips, id_lote, px_id]
        # en lotes muy planos el aspecto no está definido (pendiente 0)
        umbral_cobertura: 0.85
        columnas_prohibidas: *prohibidas_lotes
        motivo_prohibidas: *motivo_lotes
        columnas:
          - {nombre: elevacion_m, rango: [50, 700]}
          - {nombre: pendiente_pct, rango: [0, 60]}
          - {nombre: aspecto_grados, rango: [0, 360]}
          - {nombre: curv_plan, rango: [-1, 1]}
          - {nombre: curv_perfil, rango: [-1, 1]}
          - {nombre: tpi_90m_m, rango: [-30, 30]}
          - {nombre: tpi_300m_m, rango: [-50, 50]}
          - {nombre: twi, rango: [0, 40]}
          - {nombre: prof_depresion_m, rango: [0, 30]}
          - {nombre: elevacion_3dep_m, rango: [50, 700], peso: 0.5}
          - {nombre: pendiente_3dep_pct, rango: [0, 100], peso: 0.5}
          - {nombre: tpi_90m_3dep_m, rango: [-30, 30], peso: 0.5}
          - {nombre: twi_3dep, rango: [0, 40], peso: 0.5}
          - {nombre: prof_depresion_3dep_m, rango: [0, 30], peso: 0.5}
      - ruta: data/processed/lotes/suelo_px.csv
        temporal: estatico
        unidad: fila
        claves: [fips, id_lote, px_id, mukey]
        columnas:
          - {nombre: frac_mukey, rango: [0, 1]}
      - ruta: data/processed/lotes/suelo_mukey.csv
        temporal: estatico
        unidad: fila
        claves: [mukey]
        # map units de agua o sin horizontes dejan huecos
        umbral_cobertura: 0.9
        columnas:
          - {nombre: muname, tipo: texto}
          - {nombre: aws0_100_mm, rango: [0, 600]}
          - {nombre: aws0_150_mm, rango: [0, 800]}
          - {nombre: soc0_30_gm2, rango: [0, 100000]}
          - {nombre: nccpi_general, rango: [0, 1]}
          - {nombre: nccpi_maiz, rango: [0, 1]}
          - {nombre: nccpi_soja, rango: [0, 1]}
          - {nombre: clase_drenaje, tipo: texto}
          - {nombre: clase_drenaje_mas_humeda, tipo: texto}
          - {nombre: grupo_hidrologico, tipo: categoria, valores: [A, B, C, D, A/D, B/D, C/D]}
          - {nombre: pct_componentes_hidricos, rango: [0, 100]}
          - {nombre: pct_encharcamiento, rango: [0, 100]}
          # flodfreqdcd traducido: None → nula, Very rare → muy_rara, Rare → rara, Occasional → ocasional, ...
          - {nombre: frec_inundacion, tipo: categoria, valores: [nula, muy_rara, rara, ocasional, frecuente, muy_frecuente]}
          - {nombre: napa_min_cm, rango: [0, 300]}
          - {nombre: pendiente_dcd_pct, rango: [0, 100]}
          - {nombre: pendiente_comp_pct, rango: [0, 100]}
          - {nombre: clase_erosion, tipo: texto}
          - {nombre: pct_comp_dominante, rango: [0, 100]}
          - {nombre: materia_organica_pct, rango: [0, 100]}
          - {nombre: arcilla_pct, rango: [0, 100]}
          - {nombre: arena_pct, rango: [0, 100]}
          - {nombre: limo_pct, rango: [0, 100]}
          - {nombre: ph_agua, rango: [3, 10]}
          - {nombre: factor_k_rusle, rango: [0, 0.8]}
      - ruta: data/processed/lotes/suelo_desnudo_px.csv
        temporal: anual
        unidad: pixel
        claves: [fips, id_lote, px_id, anio]
        # con rastrojo, cultivos de cobertura o nubes no hay suelo desnudo todos los años
        umbral_cobertura: 0.4
        columnas_prohibidas: *prohibidas_lotes
        motivo_prohibidas: *motivo_lotes
        columnas:
          - {nombre: refl_blue_mar_may, rango: [-0.2, 1.6], peso: 0.5}
          - {nombre: refl_red_mar_may, rango: [-0.2, 1.6], peso: 0.5}
          - {nombre: refl_nir_mar_may, rango: [-0.2, 1.6], peso: 0.5}
          - {nombre: refl_swir1_mar_may, rango: [-0.2, 1.6], peso: 0.5}
          - {nombre: refl_swir2_mar_may, rango: [-0.2, 1.6], peso: 0.5}
          - {nombre: nbr2_mar_may, rango: [-1, 1], peso: 0.5}
          - {nombre: n_obs_mar_may, rango: [0, 60], peso: 0.5}
          - {nombre: refl_blue_oct_nov, rango: [-0.2, 1.6], peso: 0.5}
          - {nombre: refl_red_oct_nov, rango: [-0.2, 1.6], peso: 0.5}
          - {nombre: refl_nir_oct_nov, rango: [-0.2, 1.6], peso: 0.5}
          - {nombre: refl_swir1_oct_nov, rango: [-0.2, 1.6], peso: 0.5}
          - {nombre: refl_swir2_oct_nov, rango: [-0.2, 1.6], peso: 0.5}
          - {nombre: nbr2_oct_nov, rango: [-1, 1], peso: 0.5}
          - {nombre: n_obs_oct_nov, rango: [0, 60], peso: 0.5}
      - ruta: data/processed/lotes/suelo_desnudo_px_compuesto.csv
        temporal: estatico
        unidad: pixel
        claves: [fips, id_lote, px_id]
        # usa todos los años: si ML deja años afuera, lo recalcula dentro del fold con suelo_desnudo_px.csv
        umbral_cobertura: 0.9
        columnas_prohibidas: *prohibidas_lotes
        motivo_prohibidas: *motivo_lotes
        columnas:
          - {nombre: refl_blue, rango: [-0.2, 1.6], peso: 0.25}
          - {nombre: refl_red, rango: [-0.2, 1.6], peso: 0.25}
          - {nombre: refl_nir, rango: [-0.2, 1.6], peso: 0.25}
          - {nombre: refl_swir1, rango: [-0.2, 1.6], peso: 0.25}
          - {nombre: refl_swir2, rango: [-0.2, 1.6], peso: 0.25}
          - {nombre: nbr2, rango: [-1, 1], peso: 0.25}
          - {nombre: n_obs, rango: [0, 3000], peso: 0.25}
      - ruta: data/processed/lotes/clima_lote_diario.csv
        temporal: diario
        unidad: lote
        claves: [fips, id_lote, anio, fecha]
        coherencia: ["tmin_c <= tmed_c <= tmax_c"]
        columnas_prohibidas: *prohibidas_lotes
        motivo_prohibidas: *motivo_lotes
        columnas:
