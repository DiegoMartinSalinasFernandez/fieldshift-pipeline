# Checks de los entregables de datos de Field Shift (Corn Belt de EE.UU.).
#
# Salen del CLAUDE.md (secciones 4 a 7) y del catálogo de variables (loop/spec/catalogo.csv).
# Se escriben ANTES de construir, los aprueba el humano con
#     python loop/aprobar_checks.py --resumen   (los muestra en palabras simples)
#     python loop/aprobar_checks.py --aprobar   (los bloquea y hace commit)
# y durante la corrida el agente no los puede editar.
#
# Nombres de columna: los que fija el CLAUDE.md se copian tal cual. Los que el CLAUDE.md
# no fija (marcados "propuesta") siguen la convención snake_case con la unidad al final.
# El catálogo es de la versión argentina: de ahí salen solo el ID y la prioridad de cada
# variable (K01 = clave espacial, que ahora es fips; K03 = año).
#
# temporal: diario | 16d | 8d | semanal | mensual | anual | lista_anios | censo | ventana | estatico
# unidad: condado (por defecto) | estado (archivos por estado, clave fips_estado) | lote | pixel (las define
#         `unidades`) | fila (la cobertura se mide contra las filas del propio archivo)
# grande: true → el scorer lee el archivo por partes (millones de filas)
# peso (en una columna): reemplaza el peso que le daría su ID del catálogo

version: 2

puntaje:
  pesos_prioridad: {Alta: 3, Media: 2, Baja: 1}
  peso_sin_catalogo: 1
  # Una columna suma su peso completo cuando: el archivo cumple el contrato, los valores
  # están en rango y tiene esta fracción de celdas llenas en su ventana de tiempo.
  umbral_cobertura: 0.95
  parte_datos: 0.75
  parte_documentacion: 0.25
  tolerancia_fuera_de_rango: 0.001
  peso_manifest: 2
  peso_data_card: 1

contrato:
  valores_relleno_prohibidos: ["-999", "-999.0", "-9999", "-9999.0", "-99", "-99.0", "9999", "9999.0", "-32768", "32767", "65535", "nan", "NaN", "NAN", "NA", "N/A", "n/a", "null", "NULL", "None", "inf", "-inf", "Inf", "-Inf", "(D)", "(Z)", "(NA)", "(X)", "(S)", "(L)", "(H)"]
  max_mb_archivo_git: 50

data_card:
  # Tabla markdown obligatoria en docs/datasets/<paquete>.md (encabezados exactos, sin tildes)
  columnas_tabla: [archivo, columna, descripcion, unidad, fuente, id_catalogo, desde, hasta, faltantes_pct]
  secciones: ["Supuestos", "Problemas conocidos"]
  tolerancia_faltantes_pct: 2.0

# Rutas que cualquier tarea de datos puede escribir además de las de su paquete
rutas_comunes: [manifest.csv, requirements.txt]

# Unidades que no son condados (paquete lotes): cada una la define un archivo procesado. La cobertura de los
# archivos con esa unidad se mide contra las filas de ese archivo, y sus claves tienen que existir ahí.
unidades:
  lote: {archivo: data/processed/lotes/lotes.csv, claves: [fips, id_lote]}
  pixel: {archivo: data/processed/lotes/pixeles.csv, claves: [fips, id_lote, px_id]}

paquetes:

  base:
    titulo: "Paquete 0 — Base"
    seccion_claude: "§5"
    descripcion: >
      Condados del US Census (TIGER/Line o Cartographic Boundary 1:500k) filtrados a los
      estados de config/config.yaml (data/reference/condados.gpkg), tabla de condados con
      centroide y área (data/reference/condados.csv; fips de 5 dígitos como texto, estado =
      código de dos letras de config.yaml), tabla de años con las ventanas del CLAUDE.md §4
      (data/reference/anios.csv) y funciones comunes en src/common: fecha_a_anio(fecha) -> int,
      zonal_mean(...), bu_ac_a_kgha(cultivo) -> factor de config.yaml, acres_a_ha(acres) -> ha
      y validar_csv(ruta) -> lista de errores (vacía si está bien), importables con
      `from src.common import fecha_a_anio, zonal_mean, bu_ac_a_kgha, acres_a_ha, validar_csv`.
      El código va en src/base/download.py y src/base/process.py.
    escribe: [src/__init__.py, src/base/, src/common/, data/raw/base/, data/interim/base/, data/reference/condados.gpkg, data/reference/condados.csv, data/reference/anios.csv, docs/datasets/base.md]
    process: src/base/process.py
    salidas: [data/reference/condados.csv, data/reference/anios.csv]
    archivos:
      - ruta: data/reference/condados.csv
        temporal: estatico
        claves: [fips]
        columnas:
          - {nombre: estado, catalogo: K02, tipo: texto}
          - {nombre: condado, tipo: texto}
          - {nombre: lat_centroide, catalogo: K06, rango: [35, 50]}
          - {nombre: lon_centroide, catalogo: K06, rango: [-105, -80]}
          - {nombre: area_km2, rango: [1, 20000]}
      - ruta: data/reference/anios.csv
        temporal: lista_anios
        claves: [anio]
        columnas:
          - {nombre: inicio_temporada, catalogo: K04, tipo: fecha}
          - {nombre: fin_temporada, catalogo: K04, tipo: fecha}
          - {nombre: inicio_invierno_previo, catalogo: K04, tipo: fecha}
          - {nombre: fin_invierno_previo, catalogo: K04, tipo: fecha}
    especiales:
      - {id: zona_config, peso: 3, catalogo: K01, descripcion: "condados.csv tiene exactamente los condados de los estados de config.yaml (la cantidad de cada estado), con fips de 5 dígitos cuyos 2 primeros son los del estado y la columna estado coincide"}
      - {id: gpkg_condados, peso: 3, catalogo: K06, descripcion: "condados.gpkg es un GeoPackage válido con una capa de tantos polígonos como filas tiene condados.csv"}
      - {id: anios_exactos, peso: 3, catalogo: K03, descripcion: "anios.csv tiene una fila por año del período con temporada AAAA-04-01 a AAAA-09-30 e invierno previo (AAAA−1)-11-01 a AAAA-03-31"}
      - {id: funciones_comunes, peso: 3, descripcion: "fecha_a_anio, bu_ac_a_kgha (maíz 62,77; soja y trigo 67,25; avena 35,87) y acres_a_ha (0,4047) dan bien; validar_csv acepta un CSV correcto y rechaza claves duplicadas y fips inexistentes; zonal_mean existe"}

  clima:
    titulo: "clima — NASA POWER y GPM IMERG"
    seccion_claude: "§6.1"
    descripcion: >
      NASA POWER (comunidad AG, API diaria por punto en el centroide de cada condado, sin
      login, desde 1981 para climatologías y SPI) y GPM IMERG Final diario (GPM_3IMERGDF,
      0,1°; por GES DISC requiere Earthdata) como media por condado. PRISM es opcional y solo
      para validar. Salidas: clima_diario.csv, clima_mensual.csv y clima_anual.csv. Ventanas
      de clima_anual: temporada = abril a septiembre del anio, invierno previo = noviembre del
      anio − 1 a marzo del anio, julio y agosto. gdd_10_30 es el método del maíz (base 10 °C,
      tope 30 °C). Ojo: en la API mensual de POWER la lluvia viene como media en mm/día.
    escribe: [src/clima/, data/raw/clima/, data/interim/clima/, data/processed/clima/, docs/datasets/clima.md]
    process: src/clima/process.py
    salidas: [data/processed/clima/]
    requiere: [base]
    archivos:
      - ruta: data/processed/clima/clima_diario.csv
        temporal: diario
        claves: [fips, anio, fecha]
        nota: "Nombres de columna: propuesta (el CLAUDE.md dice 'variables crudas renombradas')."
        coherencia: ["tmin_c <= tmed_c <= tmax_c"]
        columnas:
          - {nombre: tmed_c, catalogo: C01, rango: [-45, 45]}
          - {nombre: tmax_c, catalogo: C02, rango: [-40, 50]}
          - {nombre: tmin_c, catalogo: C03, rango: [-50, 40]}
          - {nombre: prec_power_mm, catalogo: C08, rango: [0, 500]}
          - {nombre: prec_imerg_mm, catalogo: P01, rango: [0, 500], login: earthdata}
          - {nombre: hr_pct, catalogo: C06, rango: [0, 100]}
          - {nombre: viento_ms, catalogo: C07, rango: [0, 40]}
          - {nombre: rad_mj_m2, catalogo: C09, rango: [0, 45], desde: "1984-01-01"}
          - {nombre: gwettop, catalogo: C11, rango: [0, 1]}
          - {nombre: gwetroot, catalogo: C12, rango: [0, 1]}
          - {nombre: gwetprof, catalogo: C13, rango: [0, 1]}
          - {nombre: eto_pm_mm, catalogo: D01, rango: [0, 20]}
      - ruta: data/processed/clima/clima_mensual.csv
        temporal: mensual
        claves: [fips, anio, mes]
        coherencia:
          - "tmin_c <= tmed_c <= tmax_c"
          - "dias_tmax_gt35 <= dias_tmax_gt30"
          - "dias_tmin_le_m2 <= dias_tmin_le0"
          - "dias_lluvia_gt50 <= dias_lluvia_ge1"
          - "prec_max1d_mm <= prec_max5d_mm"
        estacionalidad:
          - {columna: tmed_c, mayor: [6, 7, 8], menor: [12, 1, 2]}
        columnas:
          - {nombre: prec_imerg_mm, catalogo: P01, rango: [0, 1500], login: earthdata}
          - {nombre: prec_power_mm, catalogo: C08, rango: [0, 1500]}
          - {nombre: tmax_c, catalogo: C02, rango: [-30, 45]}
          - {nombre: tmin_c, catalogo: C03, rango: [-40, 35]}
          - {nombre: tmed_c, catalogo: C01, rango: [-35, 40]}
          - {nombre: rad_mj_m2, catalogo: C09, rango: [0, 1100]}
          - {nombre: eto_pm_mm, catalogo: D01, rango: [0, 400]}
          - {nombre: deficit_mm, catalogo: D04, rango: [-400, 1500]}
          - {nombre: dias_tmax_gt30, catalogo: D09, rango: [0, 31]}
          - {nombre: dias_tmax_gt35, catalogo: D10, rango: [0, 31]}
          - {nombre: dias_tmin_le0, catalogo: D11, rango: [0, 31]}
          - {nombre: dias_tmin_le_m2, catalogo: D11, rango: [0, 31]}
          - {nombre: gdd_10_30, catalogo: D08, rango: [0, 650]}
          - {nombre: gdd_base0, catalogo: D08, rango: [0, 1100]}
          - {nombre: dias_lluvia_ge1, catalogo: D18, rango: [0, 31]}
          - {nombre: prec_max1d_mm, catalogo: D16, rango: [0, 500]}
          - {nombre: prec_max5d_mm, catalogo: D16, rango: [0, 800]}
          - {nombre: dias_lluvia_gt50, catalogo: D15, rango: [0, 31]}
          - {nombre: racha_seca_max_dias, catalogo: D17, rango: [0, 31]}
          - {nombre: spi1, catalogo: D06, rango: [-5, 5]}
          - {nombre: spi3, catalogo: D06, rango: [-5, 5]}
          - {nombre: spi6, catalogo: D06, rango: [-5, 5]}
          - {nombre: anom_tmed_c, catalogo: D23, rango: [-20, 20]}
          - {nombre: gwettop, catalogo: C11, rango: [0, 1]}
          - {nombre: gwetroot, catalogo: C12, rango: [0, 1]}
          - {nombre: gwetprof, catalogo: C13, rango: [0, 1]}
      - ruta: data/processed/clima/clima_anual.csv
        temporal: anual
        claves: [fips, anio]
        nota: "Nombres de las tendencias: propuesta. Las tendencias no pueden usar años posteriores al anio de la fila."
        coherencia: ["doy_ultima_helada <= doy_primera_helada"]
        columnas:
          - {nombre: doy_ultima_helada, catalogo: D12, rango: [1, 366]}
          - {nombre: doy_primera_helada, catalogo: D13, rango: [1, 366]}
          - {nombre: periodo_libre_heladas_dias, catalogo: D14, rango: [0, 366]}
          - {nombre: prec_temporada_mm, catalogo: D19, rango: [0, 2500]}
          - {nombre: gdd_temporada, catalogo: D08, rango: [0, 4000]}
          - {nombre: prec_invierno_previo_mm, catalogo: D20, rango: [0, 2000]}
          - {nombre: prec_jul_mm, catalogo: D19, rango: [0, 800]}
          - {nombre: tmax_jul_c, catalogo: D10, rango: [10, 45]}
          - {nombre: dias_tmax_gt30_jul, catalogo: D10, rango: [0, 31]}
          - {nombre: prec_ago_mm, catalogo: D19, rango: [0, 800]}
          - {nombre: deficit_temporada_mm, catalogo: D04, rango: [-2000, 2000]}
          - {nombre: tend_prec_mm_decada, catalogo: D24, rango: [-1000, 1000]}
          - {nombre: tend_tmed_c_decada, catalogo: D24, rango: [-5, 5]}

  cultivos:
    titulo: "cultivos — USDA NASS Quick Stats, Cropland Data Layer y Crop Sequence Boundaries"
    seccion_claude: "§6.2"
    descripcion: >
      NASS Quick Stats por condado (encuesta: rendimiento en bu/acre, superficie sembrada y
      cosechada en acres, producción en bu; filtros del CLAUDE.md §6.2), Crop Progress por
      estado, Censo Agropecuario 2012, 2017 y 2022 (prácticas), Cropland Data Layer (30 m, por
      estado y año, 2008–2025, EPSG:5070) y Crop Sequence Boundaries. La API de Quick Stats
      pide NASS_API_KEY (.env); sin clave, buscá la descarga pública de la base completa de
      Quick Stats. (D) y (Z) van vacíos con el código en flag_nass; las filas OTHER (COMBINED)
      COUNTIES (county_code 998) quedan afuera. NO sacar la tendencia del rendimiento.
      Guardar el valor original (bu, acres) y la conversión en otra columna con las funciones
      de src/common. Los códigos de cultivo son los de config.yaml. Los .tif de
      data/reference van a git: máximo 50 MB cada uno (comprimidos; si a 30 m no entran,
      documentá otra resolución en Supuestos).
    escribe:
      - src/cultivos/
      - data/raw/cultivos/
      - data/interim/cultivos/
      - data/processed/cultivos/
      - docs/datasets/cultivos.md
      - data/reference/clases_cdl.csv
      - data/reference/mascara_agricola.tif
      - data/reference/mascara_maiz_2008.tif
      - data/reference/mascara_maiz_2009.tif
      - data/reference/mascara_maiz_2010.tif
      - data/reference/mascara_maiz_2011.tif
      - data/reference/mascara_maiz_2012.tif
      - data/reference/mascara_maiz_2013.tif
      - data/reference/mascara_maiz_2014.tif
      - data/reference/mascara_maiz_2015.tif
      - data/reference/mascara_maiz_2016.tif
      - data/reference/mascara_maiz_2017.tif
      - data/reference/mascara_maiz_2018.tif
      - data/reference/mascara_maiz_2019.tif
      - data/reference/mascara_maiz_2020.tif
      - data/reference/mascara_maiz_2021.tif
      - data/reference/mascara_maiz_2022.tif
      - data/reference/mascara_maiz_2023.tif
      - data/reference/mascara_maiz_2024.tif
      - data/reference/mascara_maiz_2025.tif
      - data/reference/mascara_soja_2008.tif
      - data/reference/mascara_soja_2009.tif
      - data/reference/mascara_soja_2010.tif
      - data/reference/mascara_soja_2011.tif
      - data/reference/mascara_soja_2012.tif
      - data/reference/mascara_soja_2013.tif
      - data/reference/mascara_soja_2014.tif
      - data/reference/mascara_soja_2015.tif
      - data/reference/mascara_soja_2016.tif
      - data/reference/mascara_soja_2017.tif
      - data/reference/mascara_soja_2018.tif
      - data/reference/mascara_soja_2019.tif
      - data/reference/mascara_soja_2020.tif
      - data/reference/mascara_soja_2021.tif
      - data/reference/mascara_soja_2022.tif
      - data/reference/mascara_soja_2023.tif
      - data/reference/mascara_soja_2024.tif
      - data/reference/mascara_soja_2025.tif
    process: src/cultivos/process.py
    salidas: [data/processed/cultivos/, data/reference/clases_cdl.csv]
    requiere: [base]
    archivos:
      - ruta: data/processed/cultivos/produccion_anual.csv
        temporal: anual
        claves: [fips, anio, cultivo]
        multiplica_por: cultivos
        # alfalfa y heno no se miden en bu y NASS no publica todos los condados. Con todo lo que
        # existe se llega a 41,6 % (loop/notes/decisiones.md, ronda 5): 40 % suma completo
        umbral_cobertura: 0.40
        columnas_prohibidas: [tendencia, detrend, anom, sin_tend]
        coherencia: ["sup_cosechada_ac <= sup_sembrada_ac"]
        columnas:
          - {nombre: sup_sembrada_ac, catalogo: Y01, rango: [0, 1000000]}
          - {nombre: sup_cosechada_ac, catalogo: Y02, rango: [0, 1000000]}
          - {nombre: produccion_bu, catalogo: Y03, rango: [0, 300000000]}
          - {nombre: rend_bu_ac, catalogo: Y04, rango: [0, 320]}
          - {nombre: rend_kgha, catalogo: Y04, rango: [0, 20000]}
          - {nombre: sup_sembrada_ha, catalogo: Y01, rango: [0, 405000]}
          - {nombre: ratio_cosechada, catalogo: Y05, rango: [0, 1.05]}
          - {nombre: flag_nass, tipo: texto, sin_cobertura: true}
      - ruta: data/processed/cultivos/rotacion_anual.csv
        temporal: anual
        claves: [fips, anio]
        desde: "2008-01-01"
        nota: "Nombres de los porcentajes por cultivo: propuesta. Los de transiciones los fija el CLAUDE.md (desde 2009: necesitan el CDL del año anterior)."
        columnas:
          - {nombre: pct_maiz, catalogo: R04, rango: [0, 100]}
          - {nombre: pct_soja, catalogo: R04, rango: [0, 100]}
          - {nombre: pct_trigo, catalogo: R04, rango: [0, 100]}
          - {nombre: pct_alfalfa, catalogo: R04, rango: [0, 100]}
          - {nombre: pct_heno, catalogo: R04, rango: [0, 100]}
          - {nombre: pct_doble_trigo_soja, catalogo: R09, rango: [0, 100]}
          - {nombre: pct_barbecho, catalogo: R14, rango: [0, 100]}
          - {nombre: pct_maiz_tras_soja, catalogo: R03, rango: [0, 100], desde: "2009-01-01"}
          - {nombre: pct_maiz_tras_maiz, catalogo: R03, rango: [0, 100], desde: "2009-01-01"}
          - {nombre: pct_soja_tras_maiz, catalogo: R03, rango: [0, 100], desde: "2009-01-01"}
          - {nombre: pct_soja_tras_soja, catalogo: R03, rango: [0, 100], desde: "2009-01-01"}
      - ruta: data/processed/cultivos/rotacion_secuencia.csv
        temporal: ventana
        claves: [fips, ventana]
        nota: "ventana = 'AAAA-AAAA' (8 años del CSB, ej. 2018-2025). Nombres: propuesta."
        columnas:
          - {nombre: pct_maiz_soja_alternado, rango: [0, 100]}
          - {nombre: pct_maiz_continuo, catalogo: R13, rango: [0, 100]}
          - {nombre: pct_soja_continua, catalogo: R13, rango: [0, 100]}
          - {nombre: pct_rotacion_trigo, rango: [0, 100]}
          - {nombre: pct_rotacion_alfalfa, catalogo: R10, rango: [0, 100]}
          - {nombre: cultivos_por_anio, catalogo: R05, rango: [0, 3]}
          - {nombre: diversidad_shannon, catalogo: R11, rango: [0, 3]}
      - ruta: data/processed/cultivos/practicas_censo.csv
        temporal: censo
        claves: [fips, anio_censo]
        # el Censo oculta condados con (D): 60 % suma completo
        umbral_cobertura: 0.6
        columnas:
          - {nombre: pct_cobertura, rango: [0, 100]}
          - {nombre: pct_labranza_cero, rango: [0, 100]}
          - {nombre: pct_drenaje_tile, rango: [0, 100]}
          - {nombre: pct_riego, rango: [0, 100]}
      - ruta: data/processed/cultivos/fenologia_estado.csv
        temporal: anual
        unidad: estado
        claves: [fips_estado, anio, cultivo]
        multiplica_por: 2
        nota: "Solo maíz y soja. Día del año en que se cruza el 50 % (interpolado)."
        coherencia: ["doy_50_sembrado <= doy_50_emergido <= doy_50_floracion <= doy_50_cosechado"]
        columnas:
          - {nombre: doy_50_sembrado, catalogo: CT03, rango: [1, 366]}
          - {nombre: doy_50_emergido, rango: [1, 366]}
          - {nombre: doy_50_floracion, catalogo: CT05, rango: [1, 366]}
          - {nombre: doy_50_cosechado, catalogo: CT04, rango: [1, 366]}
    especiales:
      - {id: clases_cdl, peso: 2, descripcion: "data/reference/clases_cdl.csv (codigo, nombre, grupo) tiene los códigos 1, 5, 24, 26, 28, 36, 37, 61 y 176 con los nombres oficiales del CDL"}
      - {id: consistencia_rendimiento, peso: 2, descripcion: "en produccion_anual.csv: produccion_bu / sup_cosechada_ac ≈ rend_bu_ac (±10 %), rend_kgha = rend_bu_ac × factor de config.yaml (±1 %), sup_sembrada_ha = sup_sembrada_ac × 0,4047 (±1 %), y rendimientos plausibles (maíz 20–300, soja 5–100, trigo 10–150, avena 20–200 bu/ac)"}
      - {id: mascara_agricola, peso: 3, catalogo: K07, descripcion: "data/reference/mascara_agricola.tif existe y es un GeoTIFF"}
      - {id: mascaras_cultivo, peso: 2, catalogo: K07, descripcion: "data/reference/mascara_maiz_<anio>.tif y mascara_soja_<anio>.tif son GeoTIFF para cada año 2008–2025 (suma en proporción)"}

  suelo_terreno:
    titulo: "suelo_terreno — gSSURGO (USDA NRCS) y SRTM / NASADEM"
    seccion_claude: "§6.5"
    descripcion: >
      gSSURGO por estado (file geodatabase con el raster MUKEY de 10 m y las tablas Valu1,
      muaggatt, component y chorizon; EPSG:5070). Alternativas: gNATSGO o Soil Data Access;
      SoilGrids v2.0 solo si gSSURGO falla. SRTM GL1 o NASADEM a 30 m. Los atributos se unen
      al raster por MUKEY y se promedian por condado contando píxeles por MUKEY dentro de la
      máscara agrícola (si existe). Verificá los nombres de columnas de Valu1 y muaggatt en la
      documentación del NRCS. Una fila por condado.
    escribe: [src/suelo_terreno/, data/raw/suelo_terreno/, data/interim/suelo_terreno/, data/processed/suelo_terreno/, docs/datasets/suelo_terreno.md]
    process: src/suelo_terreno/process.py
    salidas: [data/processed/suelo_terreno/]
    requiere: [base]
    archivos:
      - ruta: data/processed/suelo_terreno/suelo_terreno_estatico.csv
        temporal: estatico
        claves: [fips]
        nota: "Nombres: propuesta (los de Valu1 con la unidad al final: aws0_100 → aws0_100_mm)."
        columnas:
          - {nombre: aws0_100_mm, catalogo: L12, rango: [0, 600]}
