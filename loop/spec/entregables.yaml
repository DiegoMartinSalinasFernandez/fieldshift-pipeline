          - {nombre: hr_pct, rango: [0, 100], peso: 0.5}
          - {nombre: viento_ms, rango: [0, 40], peso: 0.5}
          - {nombre: rad_mj_m2, rango: [0, 40], peso: 0.5}
          - {nombre: eto_pm_mm, rango: [0, 20], peso: 0.5}
          - {nombre: deficit_mm, rango: [-20, 500], peso: 0.5}
          - {nombre: prec_imerg_mm, rango: [0, 500], desde: "2000-06-01", login: earthdata, peso: 0.5}
          - {nombre: sm_rootzone_m3m3, rango: [0, 0.6], desde: "2015-04-01", login: earthdata, peso: 0.5}
          - {nombre: sm_surface_m3m3, rango: [0, 0.6], desde: "2015-04-01", login: earthdata, peso: 0.5}
      - ruta: data/processed/lotes/clima_lote_anual.csv
        temporal: anual
        unidad: lote
        claves: [fips, id_lote, anio]
        columnas_prohibidas: *prohibidas_lotes
        motivo_prohibidas: *motivo_lotes
        columnas:
          - {nombre: prec_temporada_mm, rango: [0, 2500], peso: 0.5}
          - {nombre: prec_abr_mm, rango: [0, 600], peso: 0.5}
          - {nombre: prec_may_mm, rango: [0, 600], peso: 0.5}
          - {nombre: prec_jul_mm, rango: [0, 800], peso: 0.5}
          - {nombre: prec_ago_mm, rango: [0, 800], peso: 0.5}
          - {nombre: deficit_temporada_mm, rango: [-1500, 2000], peso: 0.5}
          - {nombre: dias_tmax_gt30_jul, rango: [0, 31], peso: 0.5}
          - {nombre: tmax_jul_c, rango: [10, 45], peso: 0.5}
          - {nombre: gdd_temporada, rango: [0, 4000], peso: 0.5}
          - {nombre: prec_invierno_previo_mm, rango: [0, 1500], peso: 0.5}
          - {nombre: dias_lluvia_gt50_abr_may, rango: [0, 61], peso: 0.5}
          - {nombre: prec_temporada_imerg_mm, rango: [0, 2500], desde: "2001-01-01", login: earthdata, peso: 0.5}
          - {nombre: prec_abr_imerg_mm, rango: [0, 600], desde: "2001-01-01", login: earthdata, peso: 0.5}
          - {nombre: prec_may_imerg_mm, rango: [0, 600], desde: "2001-01-01", login: earthdata, peso: 0.5}
          - {nombre: prec_jul_imerg_mm, rango: [0, 800], desde: "2001-01-01", login: earthdata, peso: 0.5}
          - {nombre: prec_ago_imerg_mm, rango: [0, 800], desde: "2001-01-01", login: earthdata, peso: 0.5}
          - {nombre: dias_lluvia_gt50_abr_may_imerg, rango: [0, 61], desde: "2001-01-01", login: earthdata, peso: 0.5}
          - {nombre: sm_rootzone_temporada_m3m3, rango: [0, 0.6], desde: "2015-01-01", login: earthdata, peso: 0.5}
      - ruta: data/processed/lotes/drenaje_px.csv
        temporal: estatico
        unidad: pixel
        claves: [fips, id_lote, px_id]
        columnas:
          - {nombre: drenado_canos, rango: [0, 1], peso: 0.25}
    especiales:
      - id: lotes_seleccion
        peso: 3
        paisajes:
          depresiones: {lotes: 3, condados: ["19169", "19079", "19197"], relieve_min_m: 3}
          lomas_loess: {lotes: 3, condados: ["19047", "19165"], relieve_min_m: 3}
          llanura_control: {lotes: 2, condados: ["17019"]}
          indiana: {lotes: 2, prefijo: "18"}
        descripcion: "lotes.csv tiene 10 lotes: 3 de depresiones en 19169, 19079 o 19197, 3 de lomas en 19047 o 19165, 2 de control en 17019 y 2 en Indiana; cada uno con motivo, candidatos, al menos 300 píxeles interiores, maíz o soja en 6 de 8 años y, en depresiones y lomas, más de 3 m de relieve"
      - id: lotes_claves
        peso: 2
        grilla_paso_m: 30
        descripcion: "los lotes de pixeles.csv son los de lotes.csv, n_px y n_px_interior coinciden con pixeles.csv, id_lote empieza con su fips y los centros de píxel caen en la grilla de 30 m de mascara_agricola.tif sin repetirse"
      - id: lotes_gpkg
        peso: 1
        descripcion: "data/processed/lotes/lotes.gpkg es un GeoPackage en EPSG:4326 con las capas lote, lote_interior y suelo_poligonos; lote y lote_interior tienen un polígono por lote de lotes.csv"
      - id: lotes_pureza
        peso: 1
        descripcion: "en lotes_anual.csv, lote_partido = 1 si y solo si pct_px_cultivo_principal < 90, y ese porcentaje coincide (± 0,5) con el de los píxeles interiores de cultivo_px_anual.csv"
      - id: lotes_obs_cobertura
        peso: 3
        descripcion: "vegetacion_px_obs.csv tiene observaciones de cada píxel de pixeles.csv, solo del 1 de marzo al 30 de noviembre, y en al menos 90 % de los lotes-año de 2000 a 2025 (sin contar 2012) la mediana por píxel es de 5 observaciones de Landsat o más; los n_obs de vegetacion_px_anual.csv coinciden con el archivo de observaciones"
      - id: lotes_sensores
        peso: 1
        descripcion: "cada producto con sus sensores (landsat_c2_l2: L5, L7, L8, L9; hls_l30: L8, L9; hls_s30: S2A, S2B, S2C), cada sensor solo en sus años de misión, slc_off = 1 solo en L7 desde el 2003-05-31, y 2012 con observaciones de Landsat 7"
      - id: lotes_cdl_10m
        peso: 1
        descripcion: "cultivo_px_anual.csv tiene frac_clase en 2024 y 2025 para todos los píxeles, y hay píxeles con frac_clase < 1 (señal de que salió del CDL de 10 m y no de la exportación a 30 m)"
      - id: lotes_suelo_fracciones
        peso: 1
        descripcion: "en suelo_px.csv la suma de frac_mukey por píxel no pasa de 1,01 y es al menos 0,5 en 95 % de los píxeles; todos los mukey están en suelo_mukey.csv y todos los de suelo_mukey.csv se usan"
      - id: lotes_controles_data_card
        peso: 1
        descripcion: "docs/datasets/lotes.md tiene la sección 'Controles de calidad' con los resultados de píxeles por lote, pureza, observaciones despejadas, 2012 y SLC-off, coherencia Landsat–Sentinel-2, alineación CSB–CDL, relieve y cobertura de SSURGO"

  merge:
    titulo: "merge — tablas unidas"
    seccion_claude: "§7"
    descripcion: >
      src/merge.py une los archivos procesados en dos tablas, sin perder columnas ni duplicar claves.
      data/processed/tabla_anual.csv: una fila por fips × anio × cultivo (las filas de
      produccion_anual.csv) con todas las columnas de los archivos anuales y estáticos de todos los
      paquetes (los de unidad estado se unen por los dos primeros dígitos de fips; los que tienen
      cultivo, también por cultivo). data/processed/tabla_mensual.csv: fips × anio × mes con todas las
      columnas de los *_mensual.csv. rotacion_secuencia.csv y practicas_censo.csv quedan aparte (otra
      granularidad), igual que los paquetes con fuera_de_tablas: true (lotes: data/processed/lotes/ es por lote y
      píxel y no se une). Que la lista de archivos salga de loop/spec/entregables.yaml (temporal anual,
      estatico o mensual) o de lo que haya en data/processed, no de una lista fija: cuando un paquete
      suma o cambia un archivo, hay que volver a correr merge.py. Si dos archivos tienen una columna con
      el mismo nombre, la segunda va como <paquete>_<columna>. El check compara una muestra de valores
      de las tablas con los archivos de cada paquete: una tabla vieja no pasa.
    escribe: [src/merge.py, data/processed/tabla_anual.csv, data/processed/tabla_mensual.csv, docs/datasets/merge.md]
    process: src/merge.py
    salidas: [data/processed/tabla_anual.csv, data/processed/tabla_mensual.csv]
    requiere: [base]
    requiere_paquetes_con_datos: 2
    sin_data_card: true
    archivos: []
    especiales:
      - {id: tabla_anual, peso: 3, descripcion: "tabla_anual.csv tiene claves fips, anio, cultivo sin duplicar, todas las filas de produccion_anual.csv y todas las columnas de los archivos anuales y estáticos procesados, con los mismos valores que esos archivos (muestra)"}
      - {id: tabla_mensual, peso: 3, descripcion: "tabla_mensual.csv tiene claves fips, anio, mes sin duplicar y todas las columnas de los *_mensual.csv procesados, con los mismos valores que esos archivos (muestra)"}
