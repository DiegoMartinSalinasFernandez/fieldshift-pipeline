  vegetacion:
    titulo: "vegetacion — MODIS (MOD13Q1, MOD11A2, MOD16A2, MCD12Q1)"
    seccion_claude: "§6.3"
    descripcion: >
      MOD13Q1 (NDVI, EVI, pixel reliability; 250 m, 16 días, 2000+), MOD11A2 (LST día y
      noche; 1 km, 8 días), MOD16A2 (ET y PET; 500 m, 8 días, 2001+) y MCD12Q1 (máscara
      provisoria hasta tener la del CDL) por condado. El CLAUDE.md propone AppEEARS (requiere
      Earthdata y los pedidos van en cola). Filtrar por calidad de píxel antes de promediar.
      Con las máscaras del CDL (paquete cultivos), NDVI solo de maíz y solo de soja de ese año:
      un píxel de 250 m cuenta si al menos 75 % de su área es de ese cultivo (documentar el
      umbral). Fenología con Savitzky-Golay y umbrales documentados.
    escribe: [src/vegetacion/, data/raw/vegetacion/, data/interim/vegetacion/, data/processed/vegetacion/, docs/datasets/vegetacion.md]
    process: src/vegetacion/process.py
    salidas: [data/processed/vegetacion/]
    requiere: [base]
    archivos:
      - ruta: data/processed/vegetacion/vegetacion_16d.csv
        temporal: 16d
        claves: [fips, anio, fecha]
        columnas:
          - {nombre: ndvi, catalogo: M01, rango: [-1, 1]}
          - {nombre: evi, catalogo: M02, rango: [-1, 1]}
          - {nombre: ndvi_maiz, catalogo: M01, rango: [-1, 1], desde: "2008-01-01"}
          - {nombre: ndvi_soja, catalogo: M01, rango: [-1, 1], desde: "2008-01-01"}
          - {nombre: frac_pixeles_validos, catalogo: M03, rango: [0, 1]}
      - ruta: data/processed/vegetacion/vegetacion_mensual.csv
        temporal: mensual
        claves: [fips, anio, mes]
        coherencia: ["lst_noche_c <= lst_dia_c", "et_mm <= pet_mm"]
        estacionalidad:
          - {columna: lst_dia_c, mayor: [6, 7, 8], menor: [12, 1, 2]}
        columnas:
          - {nombre: ndvi, catalogo: M01, rango: [-1, 1]}
          - {nombre: evi, catalogo: M02, rango: [-1, 1]}
          - {nombre: ndvi_maiz, catalogo: M01, rango: [-1, 1], desde: "2008-01-01"}
          - {nombre: ndvi_soja, catalogo: M01, rango: [-1, 1], desde: "2008-01-01"}
          - {nombre: lst_dia_c, catalogo: M04, rango: [-40, 75]}
          - {nombre: lst_noche_c, catalogo: M05, rango: [-50, 45]}
          - {nombre: et_mm, catalogo: M06, rango: [0, 300], desde: "2001-01-01"}
          - {nombre: pet_mm, catalogo: M07, rango: [0, 500], desde: "2001-01-01"}
          - {nombre: et_pet_ratio, rango: [0, 2], desde: "2001-01-01"}
