# Eventos de la QA de MO, WI y SD (T081), para scripts/qa_release.py --eventos (tarea T117).
# Fuente: docs/research/eventos_extremos_mo_wi_sd.md (MD) y su tabla de rendimientos finales de NASS por estado,
# docs/research/eventos_extremos_mo_wi_sd_rend.csv (CSV; la media de 5 años es una referencia, no una tendencia).
# Solo eventos de ese documento.
#
# Campos (ver serie_evento() y seccion_eventos() en scripts/qa_release.py):
#   estados: el evento se saltea con un aviso si ninguno está en el release; la tabla muestra solo esos.
#   fips: deja solo esos condados (eventos de pocos condados; los fips 29133, 29005 y 29087 son del MD).
#   anios: el año del evento y años vecinos como referencia (los vecinos no son eventos).
#   esperado: dirección de la señal según el research; fuente: sección del MD.
# Lo que no está, a propósito:
#   - sm_rootzone_anom_z (SMAP) en WI 2008: SMAP empieza en 2015.
#   - SD 2011 (inundación del Missouri): el MD dice que casi no se ve en el clima local ni en el rendimiento
#     estatal y no da condados con fips ni superficie de campo afectada; solo queda la referencia de NASS.
#   - SD 2002 y 2022: el MD no da meses ni fuente del evento; solo el rendimiento de NASS.
#   - Gradientes dentro del estado (Bootheel de MO en 2012, oeste de SD en 2017 y 2021): se miran por condado,
#     no en estas medias de estado.
# rend_dif5 compara el rendimiento implícito de condados con la media de los 5 años previos del mismo release;
# el valor de NASS citado es el de estado (CSV), así que puede diferir algunos puntos.
eventos:
  # ---------------------------------------------------------------- SD 2002, 2006 y 2022: años raros de NASS
  - titulo: "SD 2002 — maíz: rendimiento implícito de estado (bu/ac)"
    estados: [SD]
    tipo: rend_implicito
    cultivo: maiz
    anios: [2001, 2002, 2003]
    esperado: "bajo en 2002 (NASS 95 bu/ac, −14 % contra 5 años; trigo de invierno 30, −23 %; soja 31, −12 %)"
    fuente: "MD, «SD 2002, 2006 y 2022 — años raros solo en NASS»; CSV"
  - titulo: "SD 2006 — `spi3` de junio a agosto"
    estados: [SD]
    paquete: clima
    archivo: clima_mensual.csv
    columna: spi3
    meses: [6, 7, 8]
    anios: [2005, 2006, 2007]
    esperado: "negativo en 2006, peor en el centro y centro-norte (solo extractos del buscador)"
    fuente: "MD, tabla de respuesta corta (2006) y «SD 2002, 2006 y 2022»"
  - titulo: "SD 2006 — `prec_temporada_mm`"
    estados: [SD]
    paquete: clima
    archivo: clima_anual.csv
    columna: prec_temporada_mm
    anios: [2005, 2006, 2007]
    esperado: "bajo en 2006"
    fuente: "MD, tabla de respuesta corta (2006)"
  - titulo: "SD 2006 — maíz: diferencia % contra la media de los 5 años previos"
    estados: [SD]
    tipo: rend_dif5
    cultivo: maiz
    anios: [2005, 2006, 2007]
    esperado: "negativa en 2006 (NASS 97 bu/ac, −14 %; trigo de invierno 36, −7 %; soja +7 %)"
    fuente: "MD, «SD 2002, 2006 y 2022»; CSV"
  - titulo: "SD 2022 — maíz: diferencia % contra la media de los 5 años previos"
    estados: [SD]
    tipo: rend_dif5
    cultivo: maiz
    anios: [2021, 2022, 2023]
    esperado: "negativa en 2022 (NASS maíz 132 bu/ac, −11 %; soja 38, −12 %)"
    fuente: "MD, «SD 2002, 2006 y 2022»; CSV"

