# Quién es quién. Nombres genéricos: el repo es público, no van nombres, mails ni usuarios.
# plan: max o pro (cambia qué tareas puede tomar y cómo trabaja; ver MAQUINAS.md).
# pausada: true hace que el trabajador de esa máquina no tome tareas (lo lee en cada vuelta).
# estados: lo mismo que el FIELDSHIFT_ESTADOS de la máquina.
#   - En Max son los estados que baja y procesa: no se repiten entre máquinas.
#   - En Pro no se bajan ni procesan datos: solo ordenan qué tareas toma primero (research de esos estados).
maquinas:
  max-1:
    plan: max
    rol: coordinación, unión de estados y entregas a ML; procesa OH, NE y MN (T003), MO, WI y SD (T062) y ND (T149)
    estados: [OH, NE, MN, MO, WI, SD, ND]
  max-2:
    plan: max
    rol: Kansas de punta a punta (T013); notebook con RTX 4060
    estados: [KS]
  pro-1:
    plan: pro
    rol: research y código chico (T006 hecha, PR 1)
    estados: [OH, MN]   # preferencia
  pro-2:
    plan: pro
    rol: research y código chico (T005 hecha, PR 2)
    estados: [NE, KS]   # preferencia: riego, trigo de invierno
  pro-3:
    plan: pro
    rol: research y código chico (T021, PR 13); activa desde el 2026-11-15
    estados: [IA, IL, IN]   # preferencia: la primera tanda
  pro-4:
    plan: pro
    rol: research y código chico (T025, PR 11); activa desde el 2026-11-15
    estados: [IA, IL, IN, OH, NE, MN, KS]   # sin preferencia: toma por orden
  pro-5:
    plan: pro
    rol: research y código chico (T041, PR 35); activa desde el 2026-11-15
    estados: [IA, IL, IN, OH, NE, MN, KS]   # sin preferencia: toma por orden
